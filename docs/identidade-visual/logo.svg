  <!-- Nome -->
  <text x="112" y="56" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="38" font-weight="800" fill="#1F2933" letter-spacing="1">MOTOBOY</text>
  <text x="112" y="98" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="38" font-weight="800" fill="#00A86B" letter-spacing="4">SAÚDE</text>
